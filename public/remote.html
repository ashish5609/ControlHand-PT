<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ControlHand PT - Remote Control</title>
  <link rel="stylesheet" href="style.css">
  <!-- Material Symbols for beautiful icons -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <style>
    /* Mobile-only optimizations overriding general styles */
    body {
      background-color: #05070f; /* Pitch dark slate for battery saving and contrast */
      overscroll-behavior: none; /* Disables pull-to-refresh on mobile browsers */
      user-select: none;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans overflow-hidden">

  <div class="remote-control-panel">
    
    <!-- Header Area -->
    <header class="remote-header px-4 py-3 flex items-center justify-between z-10 border-b border-slate-900">
      <div class="flex items-center gap-2.5">
        <span id="remote-status-dot" class="w-3 h-3 rounded-full bg-red-500 shadow-lg shadow-red-500/50"></span>
        <span id="remote-slide-num" class="text-sm font-bold text-indigo-300 tracking-wider">-- / --</span>
      </div>
      
      <!-- Presentation Timer -->
      <div class="flex items-center gap-2 bg-slate-900 px-3.5 py-1 rounded-full border border-slate-800 shadow-inner">
        <span id="timer-display" class="font-mono text-xs font-semibold tracking-wider text-emerald-400">00:00</span>
        <button id="timer-toggle-btn" class="hover:text-indigo-400 flex items-center justify-center" title="Pause/Play Timer">
          <span class="material-symbols-outlined text-sm">pause</span>
        </button>
        <button id="timer-reset-btn" class="hover:text-red-400 flex items-center justify-center" title="Reset Timer">
          <span class="material-symbols-outlined text-sm">restart_alt</span>
        </button>
      </div>
    </header>

    <!-- Main Content (Interactive Area) -->
    <main class="flex-grow flex flex-col p-4 gap-4 overflow-hidden bg-slate-950">
      
      <!-- Navigation Tabs -->
      <div class="grid grid-cols-2 bg-slate-900/60 p-1 rounded-2xl border border-slate-800/80 backdrop-blur-md">
        <button id="tab-notes" class="py-2.5 text-sm font-semibold rounded-xl bg-indigo-600 text-white flex items-center justify-center gap-1.5 transition">
          <span class="material-symbols-outlined text-lg">description</span>
          Speaker Notes
        </button>
        <button id="tab-pointer" class="py-2.5 text-sm font-semibold rounded-xl text-slate-400 flex items-center justify-center gap-1.5 transition">
          <span class="material-symbols-outlined text-lg">gesture</span>
          Laser Pointer
        </button>
      </div>

      <!-- Tab View 1: Speaker Notes (Active by Default) -->
      <div id="notes-view" class="flex-grow flex flex-col gap-4 overflow-hidden">
        <div id="notes-container" class="glass-card flex-grow p-5 text-slate-200 overflow-y-auto text-sm leading-relaxed rounded-2xl select-text italic border border-slate-800 shadow-inner">
          Select "Start Presentation" on your computer to begin. Once active, your slide speaker notes will update here.
        </div>
        
        <!-- Quick slide selector -->
        <div class="flex items-center gap-2.5">
          <span class="text-xs text-slate-400 font-semibold uppercase tracking-wider">Jump:</span>
          <select id="slide-jump-select" class="flex-grow bg-slate-900 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-slate-200 focus:outline-none focus:border-indigo-500 shadow-md">
            <option value="">Choose a slide...</option>
          </select>
        </div>
      </div>

      <!-- Tab View 2: Laser Touchpad (Hidden by Default) -->
      <div id="pointer-view" class="hidden flex-grow flex flex-col gap-3 overflow-hidden">
        <div class="flex items-center justify-between">
          <span class="text-xs text-slate-400 font-semibold uppercase tracking-wider">Drag finger below to point:</span>
          <button id="laser-toggle-btn" class="px-3 py-1.5 bg-red-650/10 text-red-400 border border-red-500/20 rounded-full text-xs font-bold hover:bg-red-650/20 flex items-center gap-1 transition">
            <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span>
            Laser Off
          </button>
        </div>
        
        <!-- Interactive Touchpad Canvas Area -->
        <div id="touchpad" class="touchpad-area flex-grow flex items-center justify-center text-slate-500 relative">
          <!-- Stylized touchpad grid background -->
          <div class="absolute inset-0 opacity-[0.04] pointer-events-none" style="background-image: radial-gradient(circle, #fff 1px, transparent 1px); background-size: 20px 20px;"></div>
          <div class="pointer-events-none text-center p-4 z-10">
            <span class="material-symbols-outlined text-3xl mb-1 text-slate-400">pinch</span>
            <p class="text-xs text-slate-400">Laser pointer disabled</p>
          </div>
          <div id="touch-cursor" class="touchpad-cursor"></div>
        </div>
      </div>

    </main>

    <!-- Bottom Controls (Next / Prev) -->
    <footer class="p-4 bg-slate-900/60 border-t border-slate-900/80 flex gap-4 backdrop-blur-md">
      <button id="prev-btn" class="btn-nav w-[35%] bg-slate-900 hover:bg-slate-800 active:bg-slate-950 border border-slate-800 text-slate-200 rounded-2xl flex items-center justify-center gap-1 shadow-md">
        <span class="material-symbols-outlined text-2xl">chevron_left</span>
        Prev
      </button>
      <button id="next-btn" class="btn-nav w-[65%] bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white rounded-2xl flex items-center justify-center gap-1 shadow-lg shadow-indigo-600/20">
        Next
        <span class="material-symbols-outlined text-2xl">chevron_right</span>
      </button>
    </footer>

  </div>

  <!-- Socket.io client -->
  <script src="/socket.io/socket.io.js"></script>
  <!-- Remote Control Client Logic -->
  <script src="remote.js"></script>
</body>
</html>
